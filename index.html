<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jimothy-Gotchi: Raccoon Virtual Pet</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: VT323 & Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Theme Defaults */
      --lcd-bg: #8ca374;
      --lcd-pixel: #1c2718;
      --lcd-ghost: #7f9568;
      --lcd-ui: rgba(28, 39, 24, 0.3);

      --shell-bg-1: #2d6b52;
      --shell-bg-2: #1e4a38;
      --shell-bg-3: #122c22;
      --shell-border: #0f251c;
      --shell-radius: 12px 12px 40px 40px; /* Gameboy Shape by default now */
      --shell-bezel: #1b251e;
      --shell-bezel-border: #0b1712;
      --brand-text: #6ee7b7;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1a221f 0%, #0d1210 100%);
      font-family: 'Press Start 2P', monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .lcd-screen {
      background-color: var(--lcd-bg);
      color: var(--lcd-pixel);
      box-shadow: inset 3px 3px 10px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(255,255,255,0.25);
      position: relative;
    }

    .lcd-screen::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
      opacity: 0.7;
      z-index: 20;
    }

    .toy-shell {
      background: radial-gradient(circle at 35% 25%, var(--shell-bg-1) 0%, var(--shell-bg-2) 50%, var(--shell-bg-3) 100%);
      border: 8px solid var(--shell-border);
      border-radius: var(--shell-radius);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 6px 12px rgba(255, 255, 255, 0.18), inset 0 -8px 16px rgba(0, 0, 0, 0.6);
      transition: border-radius 0.4s ease, background 0.4s ease, border-color 0.4s ease;
    }

    /* Pixel Art Animations */
    @keyframes raccoonIdle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    .idle-anim { animation: raccoonIdle 1.1s steps(2, start) infinite; }

    @keyframes hissShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-3px, -2px); }
      80% { transform: translate(3px, 2px); }
    }
    .shake-anim { animation: hissShake 0.15s infinite; }

    @keyframes trashRaid {
      0% { transform: rotate(0deg) translateX(0); }
      25% { transform: rotate(-8deg) translateX(-6px); }
      75% { transform: rotate(10deg) translateX(6px); }
      100% { transform: rotate(0deg) translateX(0); }
    }
    .raid-anim { animation: trashRaid 0.35s steps(2, start) infinite; }

    @keyframes lcdGlitch {
      0% { transform: translate(0) skew(0deg); filter: hue-rotate(0deg); }
      20% { transform: translate(-2px, 1px) skew(-5deg); filter: hue-rotate(90deg) invert(0.2); }
      40% { transform: translate(2px, -1px) skew(5deg); filter: hue-rotate(-90deg) invert(0); }
      60% { transform: translate(-1px, 2px) skew(0deg); filter: hue-rotate(180deg) invert(0.5); }
      80% { transform: translate(1px, -2px) skew(2deg); filter: hue-rotate(45deg); }
      100% { transform: translate(0) skew(0deg); filter: hue-rotate(0deg); }
    }
    .glitch-effect { animation: lcdGlitch 0.3s infinite; }

    @keyframes splatDrip {
      0% { transform: scale(0.5); opacity: 1; }
      10% { transform: scale(2.5); opacity: 1; }
      100% { transform: scale(2.5) translateY(30px); opacity: 0; }
    }
    .splat-drip { animation: splatDrip 3.5s forwards; }

    /* Environment Animations */
    @keyframes cloudPan {
      from { transform: translateX(-40px); }
      to { transform: translateX(140px); }
    }
    .cloud-anim-1 { animation: cloudPan 45s linear infinite; }
    .cloud-anim-2 { animation: cloudPan 65s linear infinite 15s; }

    @keyframes twinkleStar {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.9; }
    }
    .twinkle-anim { animation: twinkleStar 3s ease-in-out infinite; }

    @keyframes flickerLight {
      0%, 100% { opacity: 0.1; }
      5% { opacity: 0.15; }
      10% { opacity: 0.05; }
      15% { opacity: 0.1; }
      50% { opacity: 0.1; }
      55% { opacity: 0.15; }
    }
    .flicker-anim { animation: flickerLight 6s infinite; }

    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none text-slate-100 overflow-x-hidden">

  <div class="relative w-full h-[95vh] min-h-[650px] max-w-[600px] flex flex-col items-center">
    
    <!-- Handheld Body Container (Dynamically scaled via flex) -->
    <div class="toy-shell w-full h-full p-4 sm:p-6 relative z-10 flex flex-col items-center justify-between">
      
      <!-- Top Brand Header -->
      <div class="w-full flex items-center justify-between px-2 pt-1 pb-3 shrink-0">
        <div class="flex items-center space-x-1">
          <span class="inline-block w-2.5 h-2.5 rounded-full animate-pulse shadow-[0_0_8px_var(--brand-text)]" style="background-color: var(--brand-text);"></span>
          <span class="text-[10px] sm:text-xs tracking-wider font-bold drop-shadow" style="color: var(--brand-text);">BE Bandit-Pet</span>
        </div>
        <div class="text-[10px] sm:text-xs tracking-widest font-extrabold uppercase" style="color: var(--brand-text);">
          JIMOTHY 2000
        </div>
      </div>

      <!-- Settings Icon Row -->
      <div class="w-full flex justify-end space-x-2 mb-2 px-2">
        <button id="deviceToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Change Device Shape">📱</button>
        <button id="colorToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Change Shell Color">🎨</button>
        <button id="lcdToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Change Screen Backlight">💡</button>
        <button id="webhookToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Set Webhook">💬</button>
        <button id="notifToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Toggle Notifications">🔕</button>
        <button id="soundToggleBtn" class="text-xs transition hover:text-white" style="color: var(--brand-text);" title="Toggle Sound">🔊</button>
      </div>

      <div class="w-full flex-1 flex flex-col min-h-[200px] p-2 sm:p-4 rounded-2xl shadow-inner border-4 shrink-0" style="background-color: var(--shell-bezel); border-color: var(--shell-bezel-border);">
        
        <!-- Gameboy Top Bezel Text -->
        <div class="w-full flex justify-center mb-1 shrink-0">
            <span class="text-[8px] font-sans tracking-[0.2em] opacity-70" style="color: var(--shell-bg-3);">DOT MATRIX WITH STEREO SOUND</span>
        </div>

        <div id="lcdScreen" class="lcd-screen w-full flex-1 rounded-lg p-2.5 flex flex-col justify-between overflow-hidden" style="color: var(--lcd-pixel);">
          
          <!-- Screen Splat & Crack Overlays -->
          <div id="screenSplat" class="absolute inset-0 z-30 hidden items-center justify-center pointer-events-none">
            <div id="splatGraphic" class="text-5xl sm:text-7xl drop-shadow-lg transition-all duration-1000 origin-center">🍅</div>
          </div>
          
          <div id="screenCrack" class="absolute inset-0 z-30 hidden pointer-events-none opacity-80">
             <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                 <path d="M50 50 L20 10 M50 50 L80 15 M50 50 L10 60 M50 50 L90 70 M50 50 L40 90 M50 50 L70 95 M40 40 L60 60 M30 50 L70 40 M45 60 L60 35" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none" />
                 <path d="M50 50 L25 15 M50 50 L85 20 M50 50 L15 65 M50 50 L85 65 M50 50 L35 85" stroke="rgba(0,0,0,0.3)" stroke-width="0.5" fill="none" />
             </svg>
          </div>

          <!-- On-Screen Interactive Menu -->
          <div id="menuScreen" class="absolute inset-0 z-40 hidden flex-col p-2" style="background-color: var(--lcd-bg);">
            <div class="flex justify-between items-center text-[9px] sm:text-[10px] font-bold border-b pb-1 mb-1" style="border-color: var(--lcd-ui);">
              <span>MAIN MENU</span>
              <span class="animate-pulse opacity-70">▼/▲</span>
            </div>
            <div id="menuList" class="flex flex-col space-y-1 text-[8px] sm:text-[9px] font-mono mt-1">
              <!-- JS populated -->
            </div>
          </div>

          <!-- Top Status Icons -->
          <div class="flex justify-between items-center text-[8px] sm:text-[9px] border-b pb-1 font-mono" style="border-color: var(--lcd-ui);">
            <span id="rankBadge" class="font-bold truncate max-w-[170px]">KIT BANDIT (AGE 1)</span>
            <div class="flex items-center space-x-1.5">
              <span id="timeClock" class="font-mono">03:14 AM</span>
              <span id="statusMoon">🌙</span>
            </div>
          </div>

          <!-- Meters Grid (Compact Pixel Indicators) -->
          <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-[8px] sm:text-[9px] my-1 border-b pb-1 shrink-0 font-mono" style="border-color: var(--lcd-ui);">
            <div>
              <div class="flex justify-between"><span>TRASH:</span><span id="hungerNum">80%</span></div>
              <div class="w-full h-1.5 sm:h-2 rounded-[2px] p-[1px]" style="background-color: var(--lcd-ghost);"><div id="hungerBar" class="h-full rounded-[1px] transition-all" style="background-color: var(--lcd-pixel); width: 80%;"></div></div>
            </div>
            <div>
              <div class="flex justify-between"><span>CHAOS:</span><span id="chaosNum">45%</span></div>
              <div class="w-full h-1.5 sm:h-2 rounded-[2px] p-[1px]" style="background-color: var(--lcd-ghost);"><div id="chaosBar" class="h-full rounded-[1px] transition-all" style="background-color: var(--lcd-pixel); width: 45%;"></div></div>
            </div>
            <div>
              <div class="flex justify-between"><span>GREASE:</span><span id="greaseNum">60%</span></div>
              <div class="w-full h-1.5 sm:h-2 rounded-[2px] p-[1px]" style="background-color: var(--lcd-ghost);"><div id="greaseBar" class="h-full rounded-[1px] transition-all" style="background-color: var(--lcd-pixel); width: 60%;"></div></div>
            </div>
            <div>
              <div class="flex justify-between"><span>ENERGY:</span><span id="energyNum">70%</span></div>
              <div class="w-full h-1.5 sm:h-2 rounded-[2px] p-[1px]" style="background-color: var(--lcd-ghost);"><div id="energyBar" class="h-full rounded-[1px] transition-all" style="background-color: var(--lcd-pixel); width: 70%;"></div></div>
            </div>
          </div>

          <!-- Main Stage: Jimothy Pixel Character Canvas / Sprite -->
          <div id="stageArea" class="relative flex-1 flex flex-col items-center justify-center min-h-[110px] overflow-hidden">

            <!-- Static LCD Printed Background -->
            <svg id="stageBackground" class="absolute inset-0 w-full h-full pixelated z-0" viewBox="0 0 120 70" preserveAspectRatio="none">
              <g style="fill: var(--lcd-pixel); stroke: var(--lcd-pixel);" opacity="0.18">
                <!-- Left side: Brick Building -->
                <rect x="0" y="0" width="35" height="70" style="fill: var(--lcd-pixel);" opacity="0.1" stroke="none" />
                <line x1="35" y1="0" x2="35" y2="70" stroke-width="1.5" />
                
                <!-- Window -->
                <rect x="6" y="10" width="20" height="26" fill="none" stroke-width="1.5" />
                <line x1="6" y1="23" x2="26" y2="23" stroke-width="1" />
                <line x1="16" y1="10" x2="16" y2="36" stroke-width="1" />
                <rect x="4" y="36" width="24" height="2" stroke="none" />
                
                <!-- Brick patterns -->
                <line x1="0" y1="46" x2="12" y2="46" stroke-width="1" />
                <line x1="12" y1="46" x2="12" y2="52" stroke-width="1" />
                <line x1="20" y1="52" x2="35" y2="52" stroke-width="1" />
                <line x1="20" y1="52" x2="20" y2="58" stroke-width="1" />
                <line x1="0" y1="60" x2="15" y2="60" stroke-width="1" />
                <line x1="15" y1="60" x2="15" y2="66" stroke-width="1" />

                <!-- Fence -->
                <rect x="85" y="35" width="6" height="35" fill="none" stroke-width="1" />
                <polygon points="85,35 88,30 91,35" fill="none" stroke-width="1" />
                <rect x="95" y="28" width="6" height="42" fill="none" stroke-width="1" />
                <polygon points="95,28 98,23 101,28" fill="none" stroke-width="1" />
                <line x1="70" y1="45" x2="120" y2="45" stroke-width="1.5" />
                <line x1="70" y1="58" x2="120" y2="58" stroke-width="1.5" />

                <!-- Dynamic Sky Elements: Clouds, Stars, Sun/Moon -->
                <g class="cloud-anim-1" style="fill: var(--lcd-pixel); opacity: 0.15;">
                  <rect x="0" y="8" width="15" height="4" rx="2" />
                  <circle cx="5" cy="7" r="3" />
                  <circle cx="10" cy="8" r="2.5" />
                </g>
                <g class="cloud-anim-2" style="fill: var(--lcd-pixel); opacity: 0.1;">
                  <rect x="-30" y="15" width="20" height="5" rx="2.5" />
                  <circle cx="-25" cy="14" r="3" />
                  <circle cx="-18" cy="13" r="4" />
                  <circle cx="-13" cy="15" r="2" />
                </g>

                <g id="starGroup" style="display: none; fill: var(--lcd-pixel);">
                   <circle cx="25" cy="10" r="0.5" class="twinkle-anim" style="animation-delay: 0s;" />
                   <circle cx="55" cy="6" r="0.5" class="twinkle-anim" style="animation-delay: 1.5s;" />
                   <circle cx="85" cy="12" r="0.5" class="twinkle-anim" style="animation-delay: 0.7s;" />
                   <circle cx="110" cy="5" r="0.5" class="twinkle-anim" style="animation-delay: 2s;" />
                </g>

                <!-- Celestial Body (Moves dynamically via JS) -->
                <g id="celestialBody" transform="translate(100, 15)"></g>

                <!-- Powerlines -->
                <path d="M 35,5 Q 75,20 120,0" fill="none" stroke-width="0.75" />
                <path d="M 35,15 Q 75,30 120,10" fill="none" stroke-width="0.75" />

                <!-- Street Lamp -->
                <line x1="72" y1="45" x2="72" y2="25" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                <path d="M 72,25 Q 75,20 80,22" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                <polygon points="78,21 82,23 83,25 77,25" fill="var(--lcd-pixel)"/>
                <!-- The light beam (Night only) -->
                <g id="streetLightBeam" class="flicker-anim" style="fill: var(--lcd-pixel); opacity: 0.1;">
                  <polygon points="80,25 65,45 95,45" />
                </g>

                <!-- Distant Dumpster -->
                <path d="M 42,45 L 68,45 L 68,65 L 42,65 Z" fill="none" stroke-width="1" />
                <line x1="40" y1="45" x2="70" y2="45" stroke-width="1.5" />
                <line x1="0" y1="65" x2="120" y2="65" stroke-width="1" />
                <line x1="0" y1="68" x2="120" y2="68" stroke-width="2" />
              </g>
              <g id="trashPalaceGroup"></g>
            </svg>

            <!-- Reaction Bubble -->
            <div id="speechBubble" class="absolute top-0 px-2 py-0.5 text-[8px] sm:text-[10px] rounded border opacity-0 transition-opacity duration-200 z-20 max-w-[200px] text-center" style="background-color: var(--lcd-pixel); color: var(--lcd-bg); border-color: var(--lcd-pixel);">
              *SCUTTLE*
            </div>

            <!-- Dream Bubble -->
            <div id="dreamBubble" class="absolute top-1 right-2 hidden flex-col items-center justify-center p-1 border rounded z-20 shadow-sm" style="background-color: var(--lcd-bg); border-color: var(--lcd-pixel);">
              <span id="dreamIcon" class="text-sm sm:text-base pixelated">💭</span>
            </div>

            <!-- Jimothy Vector Graphic (Dynamically scaled) -->
            <div id="jimothyGraphic" class="relative z-10 idle-anim cursor-pointer transition-transform duration-200 h-[45%] min-h-[70px] max-h-[160px] flex items-end">
              <svg id="jimothySvg" class="h-full w-auto pixelated" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Tail -->
                <path d="M 68 62 C 82 62, 94 56, 92 42 C 90 34, 80 34, 76 40 C 74 46, 75 52, 68 56 Z" style="fill: var(--lcd-pixel);" />
                <path d="M 77 45 C 80 43, 85 45, 85 49" style="stroke: var(--lcd-bg);" stroke-width="3" stroke-linecap="round" />
                <path d="M 72 52 C 78 50, 83 54, 83 57" style="stroke: var(--lcd-bg);" stroke-width="3" stroke-linecap="round" />
                <!-- Body -->
                <ellipse cx="50" cy="56" rx="22" ry="18" style="fill: var(--lcd-pixel);" />
                <ellipse cx="49" cy="58" rx="14" ry="11" style="fill: var(--lcd-ghost);" />
                <!-- Ears -->
                <polygon points="34,26 42,12 48,27" style="fill: var(--lcd-pixel);" />
                <polygon points="37,24 42,16 46,25" style="fill: var(--lcd-ghost);" />
                <polygon points="66,26 58,12 52,27" style="fill: var(--lcd-pixel);" />
                <polygon points="63,24 58,16 54,25" style="fill: var(--lcd-ghost);" />
                <!-- Head & Mask -->
                <ellipse cx="50" cy="35" rx="21" ry="15" style="fill: var(--lcd-pixel);" />
                <ellipse cx="50" cy="36" rx="18" ry="8" style="fill: var(--lcd-ghost);" />
                <ellipse cx="41" cy="35" rx="6" ry="5" style="fill: var(--lcd-pixel);" />
                <ellipse cx="59" cy="35" rx="6" ry="5" style="fill: var(--lcd-pixel);" />
                <!-- Eyes -->
                <g id="jimothyEyes">
                  <circle cx="41" cy="34" r="2.2" style="fill: var(--lcd-bg);" />
                  <circle cx="42" cy="34" r="1.1" style="fill: var(--lcd-pixel);" />
                  <circle cx="59" cy="34" r="2.2" style="fill: var(--lcd-bg);" />
                  <circle cx="58" cy="34" r="1.1" style="fill: var(--lcd-pixel);" />
                </g>
                <!-- Zzz for sleeping (Hidden by default) -->
                <g id="sleepZzz" style="display: none;">
                  <text x="65" y="20" font-family="monospace" font-size="12" style="fill: var(--lcd-pixel); animation: raccoonIdle 2s infinite;">Z</text>
                  <text x="75" y="10" font-family="monospace" font-size="16" style="fill: var(--lcd-pixel); animation: raccoonIdle 2.5s infinite;">z</text>
                </g>
                <!-- Snout -->
                <ellipse cx="50" cy="41" rx="5" ry="3.5" style="fill: var(--lcd-bg);" />
                <polygon points="48,40 52,40 50,42" style="fill: var(--lcd-pixel);" />
                <line x1="33" y1="39" x2="25" y2="38" style="stroke: var(--lcd-pixel);" stroke-width="1.5" />
                <line x1="67" y1="39" x2="75" y2="38" style="stroke: var(--lcd-pixel);" stroke-width="1.5" />
                <!-- Paws -->
                <ellipse cx="38" cy="56" rx="4" ry="3" style="fill: var(--lcd-pixel);" />
                <ellipse cx="62" cy="56" rx="4" ry="3" style="fill: var(--lcd-pixel);" />
                <ellipse cx="38" cy="73" rx="5" ry="3.5" style="fill: var(--lcd-pixel);" />
                <ellipse cx="62" cy="73" rx="5" ry="3.5" style="fill: var(--lcd-pixel);" />
                <!-- Crown -->
                <g id="crownSlot" style="display: none;">
                  <polygon points="42,16 46,21 50,14 54,21 58,16 57,25 43,25" style="fill: var(--lcd-pixel);" />
                </g>
              </svg>
            </div>

            <!-- Ground Props -->
            <div id="groundProps" class="relative z-10 w-full flex justify-between items-end px-3 text-xs -mt-1 font-mono">
              <span id="trashPropLeft">🥫</span>
              <span id="shinyCountLabel" class="text-[7px] font-bold">✨ CAPS: <span id="capsVal">3</span></span>
              <span id="trashPropRight">🗑️</span>
            </div>

            <!-- Mini-Game Overlay -->
            <div id="miniGameScreen" class="absolute inset-0 p-2 flex flex-col justify-between hidden z-20" style="background-color: var(--lcd-bg);">
              <div class="flex justify-between items-center text-[7px] font-bold border-b pb-1" style="border-color: var(--lcd-ui);">
                <span id="gameTitle">MIDNIGHT RAID</span>
                <span id="gameTimer">TIME: 15s</span>
              </div>
              <div id="gameArena" class="relative flex-1 rounded border overflow-hidden my-1 flex items-center justify-center" style="background-color: var(--lcd-ghost); border-color: var(--lcd-ui);"></div>
              <div class="text-[7px] text-center" id="gameInstructions">TAP [A] TIP BIN | [B] SNEAK</div>
            </div>
          </div>

          <!-- Action Log -->
          <div id="bottomConsole" class="border-t pt-1 flex justify-between items-center text-[9px] sm:text-[11px] shrink-0" style="border-color: var(--lcd-ui);">
            <p id="actionLog" class="truncate font-mono tracking-tight font-bold">JIMOTHY is sniffing the rug...</p>
            <span id="activityDot" class="w-1.5 h-1.5 rounded-full animate-ping shrink-0 ml-2" style="background-color: var(--lcd-pixel);"></span>
          </div>
        </div>
      </div>

  <script>
    class RetroSound {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() { this.muted = !this.muted; return this.muted; }
      playTone(freq, type = 'square', duration = 0.08, gainVal = 0.08) {
        if (this.muted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      beep() { this.playTone(880, 'square', 0.05, 0.05); }
      munch() {
        if (this.muted) return;
        this.init();
        [220, 180, 260, 150].forEach((freq, idx) => setTimeout(() => this.playTone(freq, 'triangle', 0.06, 0.1), idx * 60));
      }
      hiss() {
        if (this.muted) return;
        this.init();
        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 1000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start();
      }
      scuttle() {
        if (this.muted) return;
        [440, 520, 660, 480, 700].forEach((f, i) => setTimeout(() => this.playTone(f, 'sawtooth', 0.04, 0.05), i * 40));
      }
      fanfare() {
        if (this.muted) return;
        [440, 554, 659, 880].forEach((n, idx) => setTimeout(() => this.playTone(n, 'square', 0.12, 0.1), idx * 90));
      }
      thud() { this.playTone(90, 'triangle', 0.15, 0.15); }
    }
    const sound = new RetroSound();

    class PushNotifier {
      constructor() {
        this.enabled = false;
        this.lastNotifTime = {};
      }

      async toggle() {
        if (!("Notification" in window)) {
          setLog("Notifications not supported in this browser.");
          return false;
        }

        if (this.enabled) {
          this.enabled = false;
          return false;
        }

        if (Notification.permission === "granted") {
          this.enabled = true;
          this.testSend();
          return true;
        } else if (Notification.permission !== "denied") {
          const permission = await Notification.requestPermission();
          if (permission === "granted") {
            this.enabled = true;
            this.testSend();
            return true;
          } else {
            setLog("Notification permission denied.");
          }
        } else {
           setLog("Notifications blocked by browser.");
        }
        return false;
      }
      
      testSend() {
        if(this.enabled) new Notification("Jimothy-Gotchi", { body: "Notifications enabled! 🦝" });
      }

      send(type, title, body, cooldown = 60000) {
        if (!this.enabled || !("Notification" in window) || Notification.permission !== "granted") return;
        
        const now = Date.now();
        if (now - (this.lastNotifTime[type] || 0) < cooldown) return;
        
        this.lastNotifTime[type] = now;
        try {
          new Notification(title, { body: body });
        } catch(e) {
          console.warn("Notification failed", e);
        }
      }
    }

    function updateClockDisplay() {
      const now = new Date();
      let hrs = now.getHours();
      let mins = now.getMinutes();
      document.getElementById('timeClock').textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;

      // Dynamic Environment Setup
      const isDay = hrs >= 6 && hrs < 18;
      const statusMoon = document.getElementById('statusMoon');
      const starGroup = document.getElementById('starGroup');
      const celestialBody = document.getElementById('celestialBody');
      const streetLightBeam = document.getElementById('streetLightBeam');
      
      let f; // 0.0 to 1.0 representing progress through the day or night
      
      if (isDay) {
         f = (hrs - 6 + mins/60) / 12;
         if (statusMoon) statusMoon.textContent = '☀️';
         if (starGroup) starGroup.style.display = 'none';
         if (streetLightBeam) streetLightBeam.style.display = 'none';
         if (celestialBody) {
             celestialBody.innerHTML = `
                 <circle cx="0" cy="0" r="3.5" fill="none" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="-6" y1="0" x2="-8" y2="0" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="6" y1="0" x2="8" y2="0" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="0" y1="-6" x2="0" y2="-8" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="0" y1="6" x2="0" y2="8" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="-4" y1="-4" x2="-5.5" y2="-5.5" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="4" y1="4" x2="5.5" y2="5.5" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="-4" y1="4" x2="-5.5" y2="5.5" stroke="var(--lcd-pixel)" stroke-width="1"/>
                 <line x1="4" y1="-4" x2="5.5" y2="-5.5" stroke="var(--lcd-pixel)" stroke-width="1"/>
             `;
         }
      } else {
         let nightHrs = hrs >= 18 ? hrs - 18 : hrs + 6;
         f = (nightHrs + mins/60) / 12;
         if (statusMoon) statusMoon.textContent = '🌙';
         if (starGroup) starGroup.style.display = 'block';
         if (streetLightBeam) streetLightBeam.style.display = 'block';
         if (celestialBody) {

         }
      }

      // Parabolic arc for the Sun/Moon across the LCD sky

         const x = 20 + (f * 90); 
         const y = 25 - (Math.sin(f * Math.PI) * 18);
         celestialBody.setAttribute('transform', `translate(${x}, ${y})`);
      }
    }

      "Dreaming of stealing a sports car...",
      "Dreaming of knife fighting a possum...",
      "Dreaming of a throne of pizza boxes...",
      "Dreaming of tax evasion...",
      "Dreaming of the perfect garbage bag...",
      "Dreaming of chasing the neighbor's dog...",
      "Dreaming of the holy grail of grease..."
    ];

    function cycleDreams() {
      if (!pet.isSleeping) return;
      document.getElementById('dreamIcon').textContent = dreamEmojis[Math.floor(Math.random() * dreamEmojis.length)];
      setLog(dreamTexts[Math.floor(Math.random() * dreamTexts.length)]);
    }

    setInterval(() => {
      pet.ageMinutes += 1;
      if (pet.isSleeping) {
        pet.energy = Math.min(100, pet.energy + 8);
        // Hunger, chaos, and grease are COMPLETELY PAUSED while sleeping!
      } else {
        pet.hunger = Math.max(0, pet.hunger - 2.5);
        pet.chaos = Math.min(100, pet.chaos + 2);
        pet.grease = Math.max(0, pet.grease - 1);
        pet.energy = Math.max(0, pet.energy - 1.5);

        // Notifications for critical states (cooldown prevents spamming)
        if (pet.hunger < 20) {
          notifier.send('hunger', 'Starvation Imminent! 🥫', 'Jimothy is chewing the drywall. Feed him some trash before he eats your router!', 120000);
        } else if (pet.chaos > 85) {
          notifier.send('chaos', 'Absolute Havoc! 🔥', 'Jimothy is going feral. You might want to check on him before he devours your fridge...', 120000);
        }

        // Throw condition logic!
        if (pet.chaos >= 60 && pet.hunger < 50 && Math.random() < 0.4) {
            if (!isAnimatingThrow) throwTrashAtScreen();
        } else if (Math.random() < 0.25) {
          triggerRandomAntics();
        } else {
          // Palace Building Mechanics
          if (pet.raidFrenzy > 0) {
              pet.raidFrenzy--;
              pet.trashCollected = (pet.trashCollected || 0) + 8;
              if (Math.random() < 0.4) setLog("RAID FRENZY! Palace building accelerated!");
          } else if (pet.hunger >= 20) {
              // Costs 3 TRASH (Hunger) to actively build his home
              pet.hunger -= 3;
              pet.trashCollected = (pet.trashCollected || 0) + 2;
              if (Math.random() < 0.2) setLog("Jimothy spent some TRASH to upgrade his palace.");
          } else {
              // Too hungry to build effectively
              pet.trashCollected = (pet.trashCollected || 0) + 0.2;
              if (Math.random() < 0.2) setLog("Need more TRASH to build palace...");
          }
          drawTrashPalace();
        }
      }
      updateHUD();
    }, 10000);

    function toggleNap() {
      if (pet.inMiniGame) return;
      pet.isSleeping = !pet.isSleeping;
      
      const dreamBubble = document.getElementById('dreamBubble');
      
      if (pet.isSleeping) {
        elements.graphic.classList.remove('idle-anim');
        elements.eyes.style.display = 'none';
        elements.sleepZzz.style.display = 'block';
        if (dreamBubble) {
          dreamBubble.classList.remove('hidden');
          dreamBubble.classList.add('flex');
        }
        showReaction("💤 Snoring...");
        cycleDreams();
        dreamInterval = setInterval(cycleDreams, 3500);
        sound.beep();
      } else {
        elements.graphic.classList.add('idle-anim');
        elements.eyes.style.display = 'block';
        elements.sleepZzz.style.display = 'none';
        if (dreamBubble) {
          dreamBubble.classList.add('hidden');
          dreamBubble.classList.remove('flex');
        }
        if (dreamInterval) clearInterval(dreamInterval);
        showReaction("👀 Awake!");
        setLog("Jimothy's eyes popped open.");
        sound.beep();
      }
    }

    let miniGameInterval = null;
    let miniGameTimerVal = 15;
    let dogWaking = 0;
    let cansTipped = 0;

    function initMiniGame() {
      if (pet.energy < 15) { showReaction("Too tired!"); sound.thud(); return; }
      pet.inMiniGame = true;
      miniGameTimerVal = 15;
      cansTipped = 0;
      dogWaking = 0;
      document.getElementById('miniGameScreen').classList.remove('hidden');
      document.getElementById('miniGameScreen').classList.add('flex');
      document.getElementById('gameTitle').textContent = "MIDNIGHT RAID";
      renderGameScreen();

      miniGameInterval = setInterval(() => {
        miniGameTimerVal--;
        document.getElementById('gameTimer').textContent = `TIME: ${miniGameTimerVal}s`;
        if (Math.random() > 0.45) dogWaking++;
        renderGameScreen();

        if (dogWaking >= 4) {
          endMiniGame(false, "BARK! The neighbor's dog chased you away!");
        } else if (miniGameTimerVal <= 0) {
          endMiniGame(true, `Secured ${cansTipped} bins of trash!`);
        }
      }, 1000);
    }

    function renderGameScreen() {
      const arena = document.getElementById('gameArena');
      const dogIcons = ["😴 Zzz", "🐕 Stirring", "👀 Watching!", "🚨 BARKING!"];
      arena.innerHTML = `
        <div class="w-full h-full flex flex-col justify-between p-2" style="color: var(--lcd-pixel);">
          <div class="flex justify-between text-[7px] font-bold">
            <span>BINS: ${cansTipped}</span>
            <span>${dogIcons[Math.min(3, dogWaking)]}</span>
          </div>
          <div class="flex items-center justify-around text-2xl py-1">
            <span class="text-xl">🦝</span>
            <span class="text-3xl animate-bounce">🗑️</span>
            <span class="text-[7px] font-bold px-1 py-0.5 rounded border" style="border-color: var(--lcd-pixel);">
              ${dogWaking > 1 ? "⚠️ HIDE (B)" : "LOOT (A)"}
            </span>
          </div>
          <div class="w-full h-1.5 rounded overflow-hidden" style="background-color: var(--lcd-ui);">
            <div class="h-full transition-all duration-300" style="background-color: var(--lcd-pixel); width: ${(dogWaking / 4) * 100}%;"></div>
          </div>
        </div>
      `;
    }

    function miniGameHandleButton(btn) {
      if (btn === 'A') {
        if (dogWaking >= 3) {
          sound.hiss();
          dogWaking += 2; // Instant punish for looting while watched
          renderGameScreen();
        } else {
          sound.munch();
          cansTipped++;
          dogWaking = Math.min(3, dogWaking + 1);
          renderGameScreen();
        }
      } else if (btn === 'B') {
        sound.scuttle();
        dogWaking = Math.max(0, dogWaking - 1); // Hide and calm down
        renderGameScreen();
      }
    }

    function endMiniGame(won, message) {
      clearInterval(miniGameInterval);
      pet.inMiniGame = false;
      document.getElementById('miniGameScreen').classList.add('hidden');
      document.getElementById('miniGameScreen').classList.remove('flex');
      pet.energy -= 20;

      if (won) {
        sound.fanfare();
        let loot = cansTipped * 15;
        pet.trashCollected = (pet.trashCollected || 0) + loot;
        pet.hunger = Math.min(100, pet.hunger + (cansTipped * 8)); // Replenish his TRASH meter
        pet.raidFrenzy = 6; // 60 seconds of free accelerated building
        pet.chaos += 10;
        pet.grease += 5;
        showReaction(`👑 +${loot} TRASH!`);
        message = `Looted ${cansTipped} bins & triggered a BUILD FRENZY!`;
      } else {
        document.getElementById('jimothyGraphic').classList.remove('idle-anim');
        document.getElementById('jimothyGraphic').classList.add('shake-anim');
        setTimeout(() => { 
            document.getElementById('jimothyGraphic').classList.remove('shake-anim'); 
            if (!pet.isSleeping) document.getElementById('jimothyGraphic').classList.add('idle-anim');
        }, 700);
        showReaction("💨 SCRAMBLED!");
      }
      setLog(message);
      updateHUD();
    }

    function drawTrashPalace() {
      const tc = pet.trashCollected || 0;
      const g = document.getElementById('trashPalaceGroup');
      if (!g) return;
      
      let html = '';

      if (tc > 30) {
        // Level 1: Cardboard Box Base
        html += `<path d="M 5,65 L 5,45 L 30,45 L 30,65" fill="none" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="5" y1="48" x2="30" y2="48" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <text x="8" y="57" font-size="5" font-family="monospace" fill="var(--lcd-pixel)">FRAGILE</text>
                 <path d="M 5,45 L 1,39 M 30,45 L 34,39" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>`;
      }
      if (tc > 90) {
        // Level 2: Pizza boxes & Milk Crate
        html += `<rect x="32" y="60" width="18" height="2" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <rect x="33" y="57" width="16" height="2" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <rect x="12" y="32" width="14" height="13" fill="none" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="12" y1="36" x2="26" y2="36" stroke-width="0.5" stroke="var(--lcd-pixel)"/>
                 <line x1="12" y1="40" x2="26" y2="40" stroke-width="0.5" stroke="var(--lcd-pixel)"/>
                 <line x1="16" y1="32" x2="16" y2="45" stroke-width="0.5" stroke="var(--lcd-pixel)"/>
                 <line x1="22" y1="32" x2="22" y2="45" stroke-width="0.5" stroke="var(--lcd-pixel)"/>`;
      }
      if (tc > 180) {
        // Level 3: Tire & Broken TV
        html += `<circle cx="45" cy="55" r="7" fill="none" stroke-width="2" stroke="var(--lcd-pixel)"/>
                 <circle cx="45" cy="55" r="3" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <rect x="13" y="20" width="12" height="12" rx="1" fill="none" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <rect x="15" y="22" width="8" height="8" rx="0.5" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <line x1="15" y1="20" x2="12" y2="15" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <line x1="19" y1="20" x2="24" y2="14" stroke-width="1" stroke="var(--lcd-pixel)"/>`;
      }
      if (tc > 300) {
        // Level 4: Ramps and Flag
        html += `<line x1="30" y1="45" x2="52" y2="65" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="32" y1="44" x2="54" y2="64" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="2" y1="45" x2="2" y2="15" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <path d="M 2,15 Q 8,12 12,18 Q 8,22 2,20 Z" fill="none" stroke-width="1" stroke="var(--lcd-pixel)"/>
                 <path d="M 3,16 Q 8,13 11,18 Q 8,21 3,19 Z" fill="var(--lcd-pixel)" opacity="0.3"/>`;
      }
      if (tc > 500) {
        // Level 5: The Grand Canopy & Fairy Lights
        html += `<path d="M -5,10 Q 20,-5 45,10 Z" fill="none" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <line x1="20" y1="10" x2="20" y2="20" stroke-width="1.5" stroke="var(--lcd-pixel)"/>
                 <!-- Fairy Lights string with flicker animation -->
                 <path d="M -5,10 Q 10,20 25,10 Q 35,18 45,10" fill="none" stroke-dasharray="1,4" stroke-width="2" stroke="var(--lcd-pixel)" class="flicker-anim"/>
                 <!-- Star topper with twinkle animation -->
                 <polygon points="20,-2 22,2 26,2 23,5 24,9 20,7 16,9 17,5 14,2 18,2" fill="none" stroke-width="1" stroke="var(--lcd-pixel)" class="twinkle-anim"/>`;
      }

      g.innerHTML = html;
      g.style.opacity = '0.45'; // Blend nicely but stay visible
    }

    btnMenu.addEventListener('click', () => {
      toggleMenu();
    });

    btnA.addEventListener('click', () => {
      sound.beep();
      if (isMenuOpen) {
        executeMenuOption();
        return;
      }
      if (pet.inMiniGame) {
        miniGameHandleButton('A');
        return;
      }
      if (pet.isSleeping) return;
      const food = TRASH_MENU[currentFoodIdx];
      currentFoodIdx = (currentFoodIdx + 1) % TRASH_MENU.length;
      if (food.isGross) {
        elements.graphic.classList.remove('idle-anim');
        elements.graphic.classList.add('shake-anim');
        setTimeout(() => { elements.graphic.classList.remove('shake-anim'); elements.graphic.classList.add('idle-anim'); }, 700);
        showReaction("🤮 GROSS!");
        sound.hiss();
      } else {
        sound.munch();
        showReaction(`*NOM* ${food.name}!`);
      }
      pet.hunger += food.hunger; pet.chaos += food.chaos; pet.grease += food.grease;
      setLog(food.desc);
      updateHUD();
    });

    btnB.addEventListener('click', () => {
      sound.beep();
      if (isMenuOpen) {
        toggleMenu(); // B cancels/exits the menu
        return;
      }
      if (pet.inMiniGame) {
        miniGameHandleButton('B');
        return;
      }
      if (pet.isSleeping) return;
      initMiniGame();
    });

    btnSelect.addEventListener('click', () => { sound.beep(); toggleNap(); });
    
    btnStart.addEventListener('click', () => {
      sound.scuttle();
      if (pet.isSleeping) return;
      pet.grease = Math.min(100, pet.grease + 25);
      showReaction("✨ Fresh Grime!");
      setLog("Coated Jimothy in warm, linty goodness.");
      updateHUD();
    });

    // D-Pad Mapping (Poke mechanic or Menu Navigation)
    const pokeAction = () => {
       if (pet.isSleeping || isMenuOpen) return;
       sound.scuttle(); pet.chaos += 2;
       showReaction("🐾 *GNAW!*"); setLog("Jimothy bit your finger.");
       updateHUD();
    };
    
    document.getElementById('dpadUp').addEventListener('click', () => {
      if (isMenuOpen) { sound.beep(); menuIndex = Math.max(0, menuIndex - 1); renderMenu(); } 
      else pokeAction();
    });
    
    document.getElementById('dpadDown').addEventListener('click', () => {
      if (isMenuOpen) { sound.beep(); menuIndex = Math.min(MENU_OPTIONS.length - 1, menuIndex + 1); renderMenu(); } 
      else pokeAction();
    });
    
    document.getElementById('dpadLeft').addEventListener('click', pokeAction);
    document.getElementById('dpadRight').addEventListener('click', pokeAction);

    document.getElementById('deviceToggleBtn').addEventListener('click', () => {
      sound.beep(); prefs.shapeIdx = (prefs.shapeIdx + 1) % SHAPES.length; applyPrefs(); showReaction("📱 Shape Changed", 1000);
    });
    document.getElementById('colorToggleBtn').addEventListener('click', () => {
      sound.beep(); prefs.themeIdx = (prefs.themeIdx + 1) % THEMES.length; applyPrefs(); showReaction(`🎨 ${THEMES[prefs.themeIdx].name} Theme`, 1000);
    });
    document.getElementById('lcdToggleBtn').addEventListener('click', () => {
      sound.beep(); prefs.lcdIdx = (prefs.lcdIdx + 1) % LCD_STYLES.length; applyPrefs(); showReaction(`💡 ${LCD_STYLES[prefs.lcdIdx].name} LCD`, 1000);
    });
    
    document.getElementById('notifToggleBtn').addEventListener('click', async (e) => {
      sound.beep();
      const isEnabled = await notifier.toggle();
      e.target.textContent = isEnabled ? '🔔' : '🔕';
      showReaction(isEnabled ? "🔔 Notifs ON" : "🔕 Notifs OFF", 1500);
    });

    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      const isMuted = sound.toggleMute();
      e.target.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) sound.beep();
    });

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowUp') document.getElementById('dpadUp').click();
      if (e.key === 'ArrowDown') document.getElementById('dpadDown').click();
      if (e.key === 'ArrowLeft') document.getElementById('dpadLeft').click();
      if (e.key === 'ArrowRight') document.getElementById('dpadRight').click();
      if (e.key.toLowerCase() === 'a' || e.key === '1') btnA.click();
      if (e.key.toLowerCase() === 'b' || e.key === '2') btnB.click();
    });

    loadPrefs();
    updateHUD();
  </script>
</body>
</html>
